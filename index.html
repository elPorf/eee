<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة محمد حافظ | كان وأخواتها</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Tahoma,Arial,"Segoe UI",sans-serif;
  background:#f3f6fb;
  color:#202735;
}
.container{max-width:1180px;margin:auto;padding:0 16px 45px}

.header{
  position:relative;
  min-height:96px;
  margin:0 -16px 22px;
  padding:15px 28px;
  background:linear-gradient(135deg,#14213d,#203b70);
  border:0;
  border-radius:0 0 18px 18px;
  box-shadow:0 8px 28px rgba(21,45,88,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.header:after{
  content:"";
  position:absolute;
  width:260px;height:260px;
  border-radius:50%;
  background:rgba(87,151,255,.12);
  left:-90px;top:-150px;
}
.brand-side{
  position:absolute;left:24px;top:12px;width:115px;text-align:center;z-index:2
}
.teacher-name{
  font-size:12px;font-weight:800;color:#fff;margin-bottom:5px;
  text-shadow:0 0 8px rgba(255,255,255,.4)
}
.teacher-image{
  width:115px;height:60px;object-fit:cover;object-position:center 30%;
  border-radius:8px;border:1px solid rgba(255,255,255,.35);display:block
}
.exam-head{position:relative;z-index:2;text-align:center;color:#fff}
.exam-title{font-size:28px;font-weight:800;letter-spacing:.2px}
.exam-subtitle{font-size:14px;color:#cbd9f3;margin-top:3px}

.platform-layout{
  display:grid;
  grid-template-columns:210px minmax(0,1fr);
  gap:18px;
  align-items:start;
}
.sidebar{
  position:sticky;top:14px;
  background:#fff;border:1px solid #e0e6ef;border-radius:15px;
  padding:15px;box-shadow:0 5px 20px rgba(31,54,90,.07)
}
.sidebar-title{font-size:14px;font-weight:800;color:#33415c;margin:2px 0 12px}
.nav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.nav-btn{
  height:39px;border:1px solid #dbe2ec;background:#f7f9fc;
  border-radius:9px;color:#42506a;font-weight:700;cursor:pointer;
}
.nav-btn:hover{border-color:#6b94d8;background:#edf4ff}
.nav-btn.answered{background:#e9f8f2;border-color:#9ed9c5;color:#177653}
.nav-btn.current{background:#2d6cdf;border-color:#2d6cdf;color:#fff}

.exam-main{min-width:0}
.exam-info{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:#fff;border:1px solid #e0e6ef;border-radius:13px;padding:12px 16px;
  margin-bottom:13px;box-shadow:0 4px 16px rgba(31,54,90,.05)
}
.info-label{font-size:13px;color:#69758a}
.progress-wrap{display:flex;align-items:center;gap:9px;min-width:220px}
.progress{height:7px;flex:1;background:#e7ebf2;border-radius:20px;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#2d6cdf,#51a4ff);transition:.2s}

.card{
  background:#fff;border:1px solid #dfe5ee;border-radius:15px;
  padding:22px;margin:0 0 14px;
  box-shadow:0 5px 20px rgba(31,54,90,.06)
}
.qtop{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding-bottom:11px;margin-bottom:14px;border-bottom:1px solid #edf0f5
}
.qtitle{font-size:16px;font-weight:800;color:#26344d}
.source-label{
  font-size:10px;color:#496080;background:#eef4ff;border:1px solid #d5e2f8;
  border-radius:6px;padding:4px 8px;min-height:22px;white-space:nowrap
}
.required{
  display:block;
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid rgba(255,255,255,.22);
  font-size:14px;
  color:#ffd86b;
}
.question{
  font-family:Tahoma,Arial,"Segoe UI",sans-serif;
  font-size:19px;font-weight:600;line-height:2;
  margin:0 0 15px;color:#fff;
  background:linear-gradient(135deg,#253b63,#304f80);
  padding:14px 17px;border-radius:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)
}
.option{
  display:flex;align-items:center;min-height:52px;padding:11px 14px;margin:8px 0;
  border:1px solid #dce2eb;border-radius:10px;background:#fafbfd;
  cursor:pointer;transition:.15s;color:#293345;font-size:15px;line-height:1.75
}
.option:hover{border-color:#83a8e2;background:#f2f6fd;transform:translateX(-2px)}
.option input{margin-left:10px;accent-color:#2d6cdf;transform:scale(1.05)}
.option.selected{border-color:#76a1e4;background:#edf4ff}
button{
  width:100%;border:0;border-radius:11px;padding:15px;font-size:17px;font-weight:800;
  color:#fff;background:linear-gradient(135deg,#2459b8,#2d78e5);
  cursor:pointer;box-shadow:0 7px 18px rgba(45,108,223,.22);transition:.15s
}
button:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(45,108,223,.28)}
#result{display:none;text-align:center}
.score-box{
  border:1px solid #d9e3f0;background:linear-gradient(180deg,#fff,#f7faff);
  border-radius:14px;padding:20px;margin-bottom:15px
}
.score{font-size:44px;font-weight:900;color:#2459b8;margin:8px 0}
.explain{margin-top:14px;text-align:right}
.correct{border-color:#5bbf98!important;background:#eefaf5!important}
.wrong{border-color:#e37b88!important;background:#fff1f3!important}
.answer{font-size:14px;color:#4e5b70;line-height:1.9;margin-top:8px}
.topline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#657188}
.result-title{font-size:18px;font-weight:800;color:#26344d}

@media(max-width:800px){
  .platform-layout{grid-template-columns:1fr}
  .sidebar{position:static;order:-1}
  .nav-grid{grid-template-columns:repeat(5,1fr)}
  .header{min-height:105px}
}
@media(max-width:560px){
  .container{padding:0 10px 35px}
  .header{margin:0 -10px 14px;padding:12px 10px;min-height:98px}
  .brand-side{left:10px;width:82px}
  .teacher-image{width:82px;height:45px}
  .teacher-name{font-size:9px}
  .exam-title{font-size:23px}
  .exam-subtitle{font-size:12px}
  .card{padding:15px}
  .question{font-size:17px}
  .option{font-size:14px}
  .exam-info{align-items:flex-start;flex-direction:column}
  .progress-wrap{width:100%;min-width:0}
  .nav-grid{grid-template-columns:repeat(5,1fr)}
  .nav-btn{height:35px;font-size:12px}
}
</style>
</head>

const questionNav=document.getElementById("questionNav");
const progressBar=document.getElementById("progressBar");
const progressText=document.getElementById("progressText");

questions.forEach((x,i)=>{
  const b=document.createElement("button");
  b.type="button"; b.className="nav-btn"; b.textContent=i+1;
  b.onclick=()=>document.querySelector(`[data-question-card="${i}"]`)?.scrollIntoView({behavior:"smooth",block:"start"});
  questionNav.appendChild(b);
});
function updateProgress(){
  let done=0;
  questions.forEach((_,i)=>{if(document.querySelector(`input[name="q${i}"]:checked`)) done++;});
  progressText.textContent=`${done} / ${questions.length}`;
  progressBar.style.width=`${done/questions.length*100}%`;
  document.querySelectorAll(".nav-btn").forEach((b,i)=>{
    b.classList.toggle("answered",!!document.querySelector(`input[name="q${i}"]:checked`));
  });
}

const quiz=document.getElementById("quiz");
questions.forEach((x,i)=>{
  const card=document.createElement("div"); card.className="card"; card.dataset.questionCard=i;
  card.innerHTML=`<div class="qtop"><div class="qtitle">السؤال ${i+1}</div><div class="source-label" style="${sourceLabels[i] ? "" : "display:none"}">${sourceLabels[i] || ""}</div></div><p class="question">${x.q}</p>`;
  x.opts.forEach((o,j)=>{
    card.innerHTML += `<label class="option" data-q="${i}" data-o="${j}"><input type="radio" name="q${i}" value="${j}"> ${["أ","ب","ج","ء"][j]}) ${o}</label>`;
  });
  quiz.appendChild(card);
  card.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      card.querySelectorAll('.option').forEach(el=>el.classList.remove('selected'));
      inp.closest('.option').classList.add('selected');
      updateProgress();
    });
  });
});
updateProgress();

document.getElementById("finish").onclick=()=>{
  let score=0, unanswered=0;
  questions.forEach((x,i)=>{
    const chosen=document.querySelector(`input[name="q${i}"]:checked`);
    if(!chosen) unanswered++;
    document.querySelectorAll(`[data-q="${i}"]`).forEach(el=>{
      const o=+el.dataset.o;
      if(o===x.ans) el.classList.add("correct");
      if(chosen && o===+chosen.value && o!==x.ans) el.classList.add("wrong");
    });
    if(chosen && +chosen.value===x.ans) score++;
  });
  const result=document.getElementById("result");
  result.style.display="block";
  result.innerHTML=`<div class="score-box"><div class="topline"><span>م/ محمد حافظ</span><span>نتيجة الاختبار</span></div><div class="result-title">تم إنهاء وتصحيح الاختبار</div><div class="score">${score} / ${questions.length}</div></div>
  <div>${unanswered ? `لم تُجب عن ${unanswered} سؤال.` : "أجبت عن جميع الأسئلة."}</div>
  <div class="explain">${questions.map((x,i)=>`<div class="card"><b>السؤال ${i+1} — الإجابة الصحيحة:</b> ${x.opts[x.ans]}<div class="answer">💡 ${x.exp}</div></div>`).join("")}</div>`;
  document.getElementById("finish").style.display="none";
  result.scrollIntoView({behavior:"smooth"});
};
</script>
</body>
